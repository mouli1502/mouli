<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>job enrollment</title>
    <link rel="stylesheet" href="stylecss.css">

</head>
<body>
<div>
<h2>Job Enrollment</h2>
<form>
    <label>username</label>
    <input type="text"><br>

    <label>password</label>
    <input type="password"><br>

    <label>email</label>
    <input type="email"><br>

    <label>bio</label>
    <textarea rows="2" cols="30"></textarea><br>

    <label>Designation</label>
    <select>
        <option>Software Engineer</option>

    </select><br>

    <label>DOB</label>
    <input type="date"><br>

    <label>Your Image</label>
    <input type="file"><br>

    <label>Mobile Number</label>
    <input type="number"><br>

    <label>Programming Level</label>
    <input type="checkbox" value="Beginner">Beginner
    <input type="checkbox" value="Intermediate">Intermediate
    <input type="checkbox" value="Professional">Professional<br>

    <label>Expertise in</label>
    <input type="radio" value="Backend">Backend
    <input type="radio" value="frontend">frontend
    <input type="radio" value="Database">Database
    <input type="radio" value="Fullstack">Fullstack<br>

    <label>Website URL</label>
    <input type="url"><br>

    <input class="botton" type="submit" value="Enroll">
    <input class = botton type="reset" value="Reset">

</form>
    </div>
</body>
</html>
